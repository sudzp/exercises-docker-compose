services:
  frontend:
    image: sudz/example-frontend 
    ports:
      - "5001:5001"
  backend:
    image: sudz/example-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DATABASE=postgres
    depends_on:
      - redis
      - db
  redis:
    image: redis:alpine3.22
    restart: unless-stopped
  
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
   

  
   
