services:
  frontend:
    image: sudz/example-frontend 
    ports:
      - "5001:5001"
  backend:
    image: sudz/example-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
  redis:
    image: redis:alpine3.22
    restart: unless-stopped

  
   
